apiVersion: v1
kind: Namespace
metadata:
  name: cafeteria
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cafeteria-config
  namespace: cafeteria
data:
  DEBUG: "0"
  ALLOWED_HOSTS: "cafeteria.company.local,backend"
  TIME_ZONE: "Europe/Moscow"
  MOCK_INTEGRATIONS: "1"
  REDIS_URL: "redis://cafeteria-redis:6379/0"
  CELERY_BROKER_URL: "redis://cafeteria-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://cafeteria-redis:6379/2"
---
apiVersion: v1
kind: Secret
metadata:
  name: cafeteria-secrets
  namespace: cafeteria
type: Opaque
stringData:
  SECRET_KEY: "prod-super-secret-key-kubernetes"
  DATABASE_URL: "postgresql://cafeteria_user:cafeteria_secret@cafeteria-postgres:5432/cafeteria_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-backend
  namespace: cafeteria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafeteria-backend
  template:
    metadata:
      labels:
        app: cafeteria-backend
    spec:
      containers:
        - name: backend
          image: cafeteria-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cafeteria-config
            - secretRef:
                name: cafeteria-secrets
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cafeteria-backend
  namespace: cafeteria
spec:
  selector:
    app: cafeteria-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-frontend
  namespace: cafeteria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafeteria-frontend
  template:
    metadata:
      labels:
        app: cafeteria-frontend
    spec:
      containers:
        - name: frontend
          image: cafeteria-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cafeteria-frontend
  namespace: cafeteria
spec:
  selector:
    app: cafeteria-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-worker
  namespace: cafeteria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafeteria-worker
  template:
    metadata:
      labels:
        app: cafeteria-worker
    spec:
      containers:
        - name: worker
          image: cafeteria-backend:latest
          command: ["celery", "-A", "core", "worker", "-l", "info", "-c", "2"]
          envFrom:
            - configMapRef:
                name: cafeteria-config
            - secretRef:
                name: cafeteria-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-beat
  namespace: cafeteria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafeteria-beat
  template:
    metadata:
      labels:
        app: cafeteria-beat
    spec:
      containers:
        - name: beat
          image: cafeteria-backend:latest
          command: ["celery", "-A", "core", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
          envFrom:
            - configMapRef:
                name: cafeteria-config
            - secretRef:
                name: cafeteria-secrets
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cafeteria-ingress
  namespace: cafeteria
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  rules:
    - host: cafeteria.company.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cafeteria-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cafeteria-frontend
                port:
                  number: 80
