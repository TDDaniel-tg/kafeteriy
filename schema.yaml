components:
  schemas:
    ActionEnum:
      enum:
      - accrual
      - deduction
      - refund
      - transfer
      - donation
      - budget_change
      - role_change
      - permission_change
      - setting_change
      - account_freeze
      - account_unfreeze
      - anomaly_action
      - order_action
      - login_2fa
      type: string
      description: |-
        * `accrual` - Начисление баллов
        * `deduction` - Списание баллов
        * `refund` - Возврат баллов
        * `transfer` - Перевод баллов
        * `donation` - Благотворительность
        * `budget_change` - Изменение бюджета
        * `role_change` - Смена роли пользователя
        * `permission_change` - Изменение матрицы прав
        * `setting_change` - Изменение настройки платформы
        * `account_freeze` - Заморозка счета
        * `account_unfreeze` - Разморозка счета
        * `anomaly_action` - Действие по аномалии
        * `order_action` - Действие с заказом
        * `login_2fa` - Подтверждение 2FA
    AnomalyTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        rule_name:
          type: string
          readOnly: true
        ticket_number:
          type: string
          maxLength: 50
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
        status:
          $ref: '#/components/schemas/AnomalyTicketStatusEnum'
        resolution_comment:
          type: string
        detected_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        rule:
          type: integer
        user:
          type: integer
        marked_by:
          type: integer
          nullable: true
      required:
      - description
      - detected_at
      - id
      - rule
      - rule_name
      - ticket_number
      - updated_at
      - user
      - user_name
    AnomalyTicketRequest:
      type: object
      properties:
        ticket_number:
          type: string
          minLength: 1
          maxLength: 50
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/AnomalyTicketStatusEnum'
        resolution_comment:
          type: string
        rule:
          type: integer
        user:
          type: integer
        marked_by:
          type: integer
          nullable: true
      required:
      - description
      - rule
      - ticket_number
      - user
    AnomalyTicketStatusEnum:
      enum:
      - detected
      - legitimate
      - blocked
      type: string
      description: |-
        * `detected` - Обнаружено
        * `legitimate` - Легитимно
        * `blocked` - Аккаунт заблокирован
    ApproverTypeEnum:
      enum:
      - none
      - manager
      - hr
      - both
      type: string
      description: |-
        * `none` - Не требуется
        * `manager` - Руководитель
        * `hr` - HR
        * `both` - Руководитель и HR
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity_type:
          type: string
          maxLength: 100
        entity_id:
          type: string
          maxLength: 100
        description:
          type: string
        payload: {}
        ip_address:
          type: string
          maxLength: 50
        integrity_hash:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - actor_name
      - created_at
      - description
      - entity_type
      - id
    GenderEnum:
      enum:
      - male
      - female
      type: string
      description: |-
        * `male` - Мужской
        * `female` - Женский
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/OrderApproval'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        can_cancel:
          type: boolean
          readOnly: true
        order_number:
          type: string
          maxLength: 50
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        total_points:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        recipient_name:
          type: string
          maxLength: 255
        recipient_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        recipient_phone:
          type: string
          maxLength: 50
        delivery_address:
          type: string
          maxLength: 255
        delivery_status:
          type: string
          maxLength: 50
        cancellation_reason:
          type: string
        is_refunded:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
      required:
      - approvals
      - can_cancel
      - created_at
      - id
      - items
      - order_number
      - status_display
      - total_points
      - updated_at
      - user
    OrderApproval:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        approver_name:
          type: string
          readOnly: true
        stage:
          $ref: '#/components/schemas/StageEnum'
        status:
          $ref: '#/components/schemas/OrderApprovalStatusEnum'
        comment:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        order:
          type: integer
        approver:
          type: integer
          nullable: true
      required:
      - approver_name
      - created_at
      - id
      - order
      - stage
    OrderApprovalRequest:
      type: object
