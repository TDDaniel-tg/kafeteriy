        stage:
          $ref: '#/components/schemas/StageEnum'
        status:
          $ref: '#/components/schemas/OrderApprovalStatusEnum'
        comment:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        order:
          type: integer
        approver:
          type: integer
          nullable: true
      required:
      - order
      - stage
    OrderApprovalStatusEnum:
      enum:
      - pending
