        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        total_points:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        recipient_name:
          type: string
          maxLength: 255
        recipient_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
