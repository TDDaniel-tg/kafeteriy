[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cafeteria-backend"
version = "1.0.0"
description = "Корпоративная система управления поощрениями и бенефитами «Кафетерий льгот»"
authors = [
    { name = "TDDaniel", email = "developer@tddaniel.netlify.app" }
]
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.3.0",
    "drf-spectacular>=0.27.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://tddaniel.netlify.app"
Documentation = "https://tddaniel.netlify.app"
